<div class="lookup-popup">
  @if (definitions.length > 0) {
    <div>
      <a class="header">{{lookupWord}}</a>
      <ol>
        @for (def of definitions; track def) {
          <li>
            <p>{{def.definition}}</p>
            <ul>
              @for (link of def.links; track link) {
                <li>{{link.name}}:
                  <a [href]="link.link" target="_blank" rel="noopener noreferrer">{{link.link}}</a>
                </li>
              }
            </ul>
          </li>
        }
      </ol>
    </div>
  }
  @if (definitions.length === 0) {
    <div>
      <p>No definition found</p>
    </div>
  }
</div>
